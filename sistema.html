<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Porxu Camper · Sistema</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A0A0B;--pan:#141416;--raise:#1C1D20;--ln:#2A2B2E;--tx:#F5F5F2;--mu:#8A8C90;--btn:#F2A900;--onbtn:#0A0A0B}}
:root[data-theme="dark"]{--bg:#0A0A0B;--pan:#141416;--raise:#1C1D20;--ln:#2A2B2E;--tx:#F5F5F2;--mu:#8A8C90;--btn:#F2A900;--onbtn:#0A0A0B}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.topo{position:fixed;inset:0;pointer-events:none;opacity:.05;background-image:repeating-radial-gradient(circle at 12% 18%,transparent 0 26px,currentColor 27px,transparent 28px),repeating-radial-gradient(circle at 88% 78%,transparent 0 40px,currentColor 41px,transparent 42px)}
header{position:sticky;top:0;z-index:20;background:var(--pan);border-bottom:1px solid var(--ln);box-shadow:0 1px 0 var(--y)}
.hw{max-width:1100px;margin:0 auto;padding:10px 16px 0}.hw img{height:34px;display:block}.lgd{display:none!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lgd{display:block!important}:root:not([data-theme="light"]) .lgl{display:none!important}}
:root[data-theme="dark"] .lgd{display:block!important}:root[data-theme="dark"] .lgl{display:none!important}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:6px}nav button{flex:1;white-space:nowrap;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font:700 13px inherit;font-family:inherit;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);cursor:pointer}nav button.on{color:var(--tx);border-bottom-color:var(--y)}
.wrap{position:relative;max-width:1100px;margin:0 auto;padding:18px 16px 60px}
.step{background:var(--pan);border:1px solid var(--ln);border-radius:12px;margin-bottom:14px;overflow:hidden}.sh{display:flex;align-items:center;gap:12px;padding:13px 16px;font-weight:800;font-size:14px;letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--ln);background:var(--raise)}.sh i{font-style:normal;background:var(--y);color:#17181b;border-radius:6px;min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:12px;padding:0 6px}.sb{padding:4px 16px 16px}
label{display:block;font-size:11.5px;color:var(--mu);margin:12px 0 5px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
input,select,textarea{width:100%;font:15px inherit;font-family:inherit;color:var(--tx);background:var(--raise);border:1px solid var(--ln);border-radius:8px;padding:11px;min-height:44px}textarea{resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--y);outline-offset:1px}input[type=file]{padding:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:70px 1fr auto;gap:8px;margin-top:6px}.it2{margin:10px 0}
.seg{display:flex;border:1px solid var(--ln);border-radius:8px;overflow:hidden}.seg button{flex:1;min-height:44px;background:none;border:0;font:700 14px inherit;font-family:inherit;color:var(--mu);cursor:pointer}.seg button.on{background:var(--y);color:#17181b}
.btn{min-height:48px;border-radius:9px;border:1px solid var(--btn);background:var(--btn);color:var(--onbtn);font:800 14px inherit;font-family:inherit;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;padding:0 14px}.btn.alt{background:transparent;color:var(--tx);border-color:var(--ln)}.btn.full{grid-column:1/-1}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}.mini{min-height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--ln);background:none;color:var(--tx);font:700 13px inherit;font-family:inherit;cursor:pointer;margin-top:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--ln);cursor:pointer}.row:last-child{border:0}.row b{display:block}.row small,.mu{color:var(--mu);font-size:13px}.step .mu{padding:10px 16px 0;margin:0}.sb .mu{padding:10px 0 0}.row>span{color:var(--y);font-size:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}.kpi{background:var(--pan);border:1px solid var(--ln);border-top:3px solid var(--y);border-radius:12px;padding:14px}.kpi span{display:block;font-size:11.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;font-weight:600}.kpi b{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:4px}.kpi small{color:var(--mu)}
.sal{display:flex;justify-content:space-between;font-weight:800;margin-top:14px;padding-top:12px;border-top:1px dashed var(--ln);font-size:17px}.sal span:last-child{color:var(--y)}
.chk{display:flex;align-items:center;gap:10px;text-transform:none;font-size:15px;color:var(--tx);letter-spacing:0;font-weight:500}.chk input{width:20px;min-height:20px;height:20px}
.hint{background:var(--pan);border:1px solid var(--ln);border-left:4px solid var(--y);border-radius:10px;padding:12px 14px;margin-bottom:14px;color:var(--mu)}
.cfb{border-left:3px solid var(--y);padding-left:12px;margin:8px 0 4px}.hero{position:relative;overflow:hidden;border-radius:20px;padding:30px 24px 28px;margin-bottom:16px;background:linear-gradient(135deg,#121315 0%,#26272b 100%);color:#f5f5f2;border:1px solid #2e3035;border-bottom:4px solid #F2A900;min-height:190px}.hero .deco{position:absolute;right:0;bottom:0;width:78%;height:100%;pointer-events:none}.hc{position:relative;z-index:1}.hero .hd{font-size:13px;color:#b9bbc0;letter-spacing:.04em}.hero h2{margin:8px 0 4px;font-size:38px;line-height:1.05;font-weight:800;letter-spacing:-.03em}.hero .hs{margin:0;font-size:16px;color:#d7d8db}.hero .tg{margin:18px 0 0;font-style:italic;color:#F2A900;font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:18px;background:var(--pan);color:var(--tx);border:1px solid var(--ln);border-radius:16px;font-family:inherit;cursor:pointer;transition:transform .15s,border-color .15s}.tile:hover{transform:translateY(-2px);border-color:var(--y)}.tile .ic{width:46px;height:46px;border-radius:13px;background:var(--y);color:#17181b;display:flex;align-items:center;justify-content:center;margin-bottom:8px}.tile b{font-size:17px;letter-spacing:-.01em}.tile small{color:var(--mu);font-size:13px;line-height:1.35}
.adv{margin-top:16px;background:var(--pan);border:1px solid var(--ln);border-radius:16px}.adv summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;padding:15px 18px;font-weight:700}.adv summary::-webkit-details-marker{display:none}.adv summary:after{content:"›";color:var(--y);font-size:22px;transform:rotate(90deg);transition:transform .15s}.adv[open] summary:after{transform:rotate(-90deg)}.adv[open] summary{border-bottom:1px solid var(--ln)}.adv .in{padding:6px 18px 18px}.adv .acts{margin:12px 0 0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#e8a317;margin-left:8px}
.gh{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);font-weight:700;padding:14px 0 4px}.adv .row{padding:12px 0}.row .mini{margin:0 0 0 6px;min-height:36px}.sb .adv{margin-top:10px;border-radius:12px}.g3d{display:grid;grid-template-columns:1fr auto;gap:6px}.g3p{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-top:6px}.ab{color:var(--y);font-weight:700;margin-right:6px}#viewer{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}#viewer .vh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--ln);background:var(--pan)}#viewer .vh b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#viewer .vb{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:10px}#viewer img{max-width:100%;height:auto}#viewer iframe{width:100%;height:100%;border:0;background:#fff}.hw{position:relative}.sync{position:absolute;right:16px;top:12px;font-size:12px;color:var(--mu);font-weight:600}.sync:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mu);margin-right:6px}.sync.ok:before{background:#2ecc71}.sync.err:before{background:#e74c3c}.cmp{max-width:560px;margin:0 auto}.cmp .sh{display:none}.cmp .sb{padding:12px 14px 14px}.cmp label{text-transform:none;font-size:13px;letter-spacing:0;font-weight:400;margin:10px 0 4px}.cmp .step{margin-bottom:10px}.cmp .pv{position:static}canvas{width:100%;height:auto;display:block;border-radius:6px;border:1px solid var(--ln);background:#fff}
